<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quietly Krowned · Private Beta Dashboard</title><style>body{font-family:system-ui;background:#100b17;color:#f4ecf8;max-width:1100px;margin:40px auto;padding:20px}h1{color:#d3b47a}input,button{font:inherit;padding:12px;background:#24192d;color:white;border:1px solid #756183;border-radius:8px}button{cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:20px}td,th{padding:12px;border-bottom:1px solid #463550;text-align:left}main{overflow:auto}.stats{display:flex;gap:16px;flex-wrap:wrap}.stats div{padding:18px;background:#251a30;border-radius:10px}small{color:#c6b9cc}</style></head><body><h1>Quietly Krowned · Beta Activity</h1><p>Participation counts only. Journal writing is never shown here.</p><label>Admin token <input id="token" type="password" autocomplete="off" placeholder="Private dashboard token"></label><button id="load">View activity</button><button id="clear">Clear token</button><p id="status" role="status"></p><main id="dashboard"></main><script>
const $=id=>document.getElementById(id);$('token').value=sessionStorage.getItem('qk_admin_token')||'';$('clear').onclick=()=>{sessionStorage.removeItem('qk_admin_token');$('token').value='';$('dashboard').replaceChildren();$('status').textContent='Token cleared.'};$('load').onclick=async()=>{const token=$('token').value.trim();$('status').textContent='Loading…';try{const r=await fetch('/api/admin-stats',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Invalid admin token':'Could not load analytics');const d=await r.json();sessionStorage.setItem('qk_admin_token',token);$('dashboard').replaceChildren();const cards=document.createElement('div');cards.className='stats';for(const [label,value] of Object.entries(d.totals)){const c=document.createElement('div');c.textContent=label.replace(/([A-Z])/g,' $1')+': '+value;cards.append(c)}$('dashboard').append(cards);const table=document.createElement('table');const head=document.createElement('tr');for(const x of ['Participant','Entries','Active days','Mirror','Patterns','Energy','👍','👎','Last active']){const th=document.createElement('th');th.textContent=x;head.append(th)}table.append(head);for(const p of d.participants){const tr=document.createElement('tr');for(const x of [p.id,p.entries,p.activeDays,p.mirror,p.patterns,p.energy,p.yes,p.no,p.lastActive?new Date(p.lastActive).toLocaleDateString():'']){const td=document.createElement('td');td.textContent=x;tr.append(td)}table.append(tr)}$('dashboard').append(table);$('status').textContent=d.limited?'Showing up to 10,000 events.':'Activity loaded. Dates reflect server timestamps.'}catch(e){$('status').textContent=e.message}};
</script></body></html>
